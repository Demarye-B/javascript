<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
      body {
        margin: 20px;
        line-height: 1.6;
      }

      @media (min-width: 600px) {
        body {
          max-width: 800px;
          margin-left: auto;
          margin-right: auto;
        }
      }

      h1 {
        text-align: center;
        color: white;
        background-color: #47a3ff;
        border: 10px solid #004da0; 
      }

      .centeredwin {
        text-align: center;
        color: white;
        background-color: #33ff64;
        border: 10px solid #009e26;
        border-radius: 20px;
      }
      .centeredlose {
        text-align: center;
        color: white;
        background-color: red;
        border: 10px solid #960f0f;
      }
    </style>
  </head>
  <body>
     <header>
        <h1>Welcome to the Secret Number Game!</h1>
    </header>
    <main>
      
    </main>
    <script>
      var secretnum = 3
      var guess = prompt("What's your favorite number between 1 and 5?");
       guess = parseInt(guess);
       while(isNaN(guess)){
	      guess = prompt("That's not a number! What's your favorite number between 1 and 5?");
	      guess = parseInt(guess);
      }
      if (guess == secretnum) {
        document.write('<p class="centeredwin">Congrats! You made 10 points. Game Over.</p>')
      } else {
        document.write('<p class="centeredlose">Sorry! You made 0 points. Game Over.</p>')
      }
    </script>
  </body>
</html>
