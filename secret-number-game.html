<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
  </head>
  <body>
     <header>
        <h1>Welcome to the Secret Number Game!</h1>
    </header>
    <main>
      
    </main>
    <script>
      var secretnum = 3
      var guess = prompt("What's your favorite number between 1 and 5?");
       guess = parseInt(guess);
       while(isNaN(guess)){
	      guess = prompt("That's not a number! What's your favorite number between 1 and 5?");
	      guess = parseInt(guess);
      }
      if (guess == secretnum) {
        document.write("Congrats! You made 10 points")
      } else {
        document.write("Sorry! You made 0 points.")
      }
    </script>
  </body>
</html>
