<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
      h1 {
        text-align: center;
        color: white;
        background-color: #47a3ff;
        border: 10px solid #004da0; 
      }

      .centeredwin {
        text-align: center;
        color: white;
        background-color: #33ff64;
        border: 10px solid #009e26;
        border-radius: 20px;
      }
      .centeredlose {
        text-align: center;
        color: white;
        background-color: red;
        border: 10px solid #960f0f;
      }
    </style>
  </head>
  <body>
     <header>
        <h1>Welcome to the Secret Number Game!</h1>
    </header>
    <nav><a href="about-me.html">About Me</a></nav>
    <main>
      
    </main>
      <script>
      var secretnum = 3;
      var guess = 0;
      var tries = 0;
      var max = 5;

      while (tries < max) {

        guess = prompt("Pick a number between 1 and 5.");
        guess = parseInt(guess);

        // validate number
        while (isNaN(guess)) {
          guess = prompt("That's not a number! Pick a number between 1 and 5.");
          guess = parseInt(guess);
        }

        // validate range
        if (guess < 1 || guess > 5) {
          alert("Your number must be between 1 and 5.");
          continue; // do NOT count this as a try
        }

        // check guess
        if (guess == secretnum) {
          document.write('<p class="centeredwin">Congrats! You made 10 points. Game Over.</p>');
          break; // STOP the loop
        } else {
          tries++;
          if (tries < max) {
            alert("Wrong guess! Try again.");
          }
        }
      }

      // lose condition
      if (tries == max && guess != secretnum) {
        document.write('<p class="centeredlose">Sorry! You made 0 points. Game Over.</p>');
      }
    </script>
  </body>
</html>
