<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
      h1 {
        text-align: center;
        color: white;
        background-color: #47a3ff;
        border: 10px solid #004da0; 
      }

      .centered {
        text-align: center;
      }
    </style>
  </head>
  <body>
     <header>
        <h1>Welcome to the Secret Number Game!</h1>
    </header>
    <main>
      
    </main>
    <script>
      var secretnum = 3
      var guess = prompt("What's your favorite number between 1 and 5?");
       guess = parseInt(guess);
       while(isNaN(guess)){
	      guess = prompt("That's not a number! What's your favorite number between 1 and 5?");
	      guess = parseInt(guess);
      }
      if (guess == secretnum) {
        document.write('<p class="centered">Congrats! You made 10 points.</p>')
      } else {
        document.write('<p class="centered">Sorry! You made 0 points.</p>')
      }
    </script>
  </body>
</html>
