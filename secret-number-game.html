<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
      h1 {
        text-align: center;
        color: white;
        background-color: #47a3ff;
        border: 10px solid #004da0; 
      }

      .centeredwin {
        text-align: center;
        color: white;
        background-color: #33ff64;
        border: 10px solid #009e26;
        border-radius: 20px;
      }
      .centeredlose {
        text-align: center;
        color: white;
        background-color: red;
        border: 10px solid #960f0f;
      }
    </style>
  </head>
  <body>
     <header>
        <h1>Welcome to the Secret Number Game!</h1>
    </header>
    <main>
      
    </main>
    <script>
      var secretnum = 3
      var guess = 0
      var tries = 0
      var max = 5

      while (tries < max) {

        guess = prompt("Pick a number between 1 and 5.");
        guess = parseInt(guess);

        while(isNaN(guess)){
          guess = prompt("That's not a number! Pick a number between 1 and 5.");
          guess = parseInt(guess);
        }

        if ((guess < 1) && (guess > 5)) {
           guess = prompt("Your number must be between 1 and 5. Pick a number between 1 and 5.");
        }

        if (guess == secretnum) {
          document.write('<p class="centeredwin">Congrats! You made 10 points. Game Over.</p>')
        } else {
          tries++;
          guess = prompt("Wrong Guess! Try again.");
        }

        if ((tries == max) && (guess != secretnum)) {
          document.write('<p class="centeredlose">Sorry! You made 0 points. Game Over.</p>')
        }
      }
    </script>
  </body>
</html>
